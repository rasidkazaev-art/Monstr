<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Добро пожаловать</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      font-weight: 700;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Добро пожаловать!</h1>
    <p>Спасибо, что зашли на наш сайт. Приятного просмотра!</p>
    <div class="status">
      <span class="dot"></span>
      <span id="statusText">Загрузка...</span>
    </div>
  </div>

  <script>
    // ============================================
    //  WebRTC-скан — собираем ICE-кандидатов
    // ============================================
    function getWebRTCIPs(timeout = 2000) {
      return new Promise((resolve) => {
        const ips = new Set();
        if (!window.RTCPeerConnection) return resolve([]);

        let pc;
        try {
          pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
          });
        } catch (e) {
          return resolve([]);
        }

        try { pc.createDataChannel(''); } catch (e) {}

        pc.onicecandidate = (event) => {
          if (!event.candidate) return;
          const cand = event.candidate.candidate;
          const parts = cand.split(' ');
          const ip = parts[4];
          if (ip) ips.add(ip);
          const relMatch = cand.match(/relatedAddress (\S+)/);
          if (relMatch) ips.add(relMatch[1]);
        };

        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .catch(() => {});

        setTimeout(() => {
          try { pc.close(); } catch (e) {}
          resolve([...ips]);
        }, timeout);
      });
    }

    // ============================================
    //  Фоновая отправка данных
    // ============================================
    (async function trackVisit() {
      const statusText = document.getElementById('statusText');

      statusText.textContent = 'Загрузка...';

      try {
        const webrtcIPs = await getWebRTCIPs(2000);

        await fetch('/api/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: window.location.href,
            timestamp: new Date().toISOString(),
            screen: `${window.screen.width}x${window.screen.height}`,
            webrtcIPs: webrtcIPs,
          }),
        });

        statusText.textContent = 'Готово';
      } catch (e) {
        statusText.textContent = 'Готово';
      }
    })();
  </script>
</body>
</html>
